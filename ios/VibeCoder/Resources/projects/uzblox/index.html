<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uzblox</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>UZBLOX</h1>
            <div class="stats">
                <div class="stat">
                    <span class="label">Score</span>
                    <span class="value" id="score">0</span>
                </div>
                <div class="stat">
                    <span class="label">Level</span>
                    <span class="value" id="level">1</span>
                </div>
                <div class="stat">
                    <span class="label">Lines</span>
                    <span class="value" id="lines">0</span>
                </div>
                <div class="stat">
                    <span class="label">High Score</span>
                    <span class="value" id="highScore">0</span>
                </div>
            </div>
        </header>

        <main>
            <div class="game-area">
                <canvas id="gameCanvas"></canvas>
                <div id="gameOver" class="game-over hidden">
                    <h2>Game Over!</h2>
                    <p>Final Score: <span id="finalScore">0</span></p>
                    <button id="restartBtn" class="btn">Play Again</button>
                </div>
                <div id="paused" class="paused hidden">
                    <h2>Paused</h2>
                </div>
            </div>

            <div class="next-piece">
                <h3>Next</h3>
                <canvas id="nextCanvas"></canvas>
            </div>

            <div class="controls">
                <div class="control-row">
                    <button id="rotateBtn" class="btn control-btn">↻ Rotate</button>
                    <button id="pauseBtn" class="btn control-btn">⏸ Pause</button>
                </div>
                <div class="control-row">
                    <button id="leftBtn" class="btn control-btn">← Left</button>
                    <button id="downBtn" class="btn control-btn">↓ Down</button>
                    <button id="rightBtn" class="btn control-btn">Right →</button>
                </div>
                <div class="control-row">
                    <button id="dropBtn" class="btn control-btn">⬇ Drop</button>
                    <button id="newGameBtn" class="btn control-btn">New Game</button>
                </div>
            </div>
        </main>

        <footer>
            <p class="instructions">
                <strong>Keyboard:</strong> Arrow keys to move, Up/Space to rotate, Enter to drop
            </p>
        </footer>
    </div>

    <script src="game.js"></script>
</body>
</html>
