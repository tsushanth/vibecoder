<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f7f6f3;
            --bg-hover: #f1f0ed;
            --border: #e8e7e3;
            --text-primary: #37352f;
            --text-secondary: #787774;
            --text-tertiary: #9b9a97;
            --accent: #2383e2;
            --accent-bg: #e8f3ff;
            --tag-bg: #efefef;
            --sidebar-width: 260px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background: var(--bg-secondary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
        }

        .app {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: var(--sidebar-width);
            background: var(--bg-primary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .sidebar-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .search-box {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 14px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            outline: none;
            transition: all 0.2s;
        }

        .search-box:focus {
            background: var(--bg-primary);
            border-color: var(--accent);
        }

        .tag-filter {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            max-height: 100px;
            overflow-y: auto;
        }

        .tag-filter-item {
            padding: 4px 8px;
            background: var(--tag-bg);
            border-radius: 3px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .tag-filter-item:hover {
            background: var(--bg-hover);
        }

        .tag-filter-item.active {
            background: var(--accent-bg);
            border-color: var(--accent);
            color: var(--accent);
        }

        .notes-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .note-item {
            padding: 12px;
            margin-bottom: 4px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .note-item:hover {
            background: var(--bg-hover);
        }

        .note-item.active {
            background: var(--accent-bg);
        }

        .note-item-title {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .note-item-preview {
            font-size: 12px;
            color: var(--text-secondary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .note-item-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 6px;
        }

        .note-tag {
            padding: 2px 6px;
            background: var(--tag-bg);
            border-radius: 3px;
            font-size: 11px;
            color: var(--text-secondary);
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
            overflow: hidden;
        }

        .editor-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .editor-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn {
            padding: 8px 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-primary);
            font-weight: 500;
        }

        .btn:hover {
            background: var(--bg-hover);
        }

        .btn-primary {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        .btn-danger {
            background: #eb5757;
            color: white;
            border-color: #eb5757;
        }

        .btn-danger:hover {
            opacity: 0.9;
        }

        .btn-icon {
            padding: 8px;
            background: transparent;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: var(--text-secondary);
        }

        .btn-icon:hover {
            background: var(--bg-hover);
            border-radius: 4px;
        }

        .editor-content {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .editor-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
        }

        .editor-pane:last-child {
            border-right: none;
        }

        .pane-header {
            padding: 12px 24px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .title-input {
            width: 100%;
            padding: 16px 24px;
            border: none;
            border-bottom: 1px solid var(--border);
            font-size: 28px;
            font-weight: 600;
            background: transparent;
            outline: none;
            color: var(--text-primary);
        }

        .title-input::placeholder {
            color: var(--text-tertiary);
        }

        .editor-textarea {
            flex: 1;
            padding: 24px;
            border: none;
            resize: none;
            font-size: 15px;
            line-height: 1.6;
            font-family: inherit;
            background: transparent;
            outline: none;
            color: var(--text-primary);
        }

        .editor-textarea::placeholder {
            color: var(--text-tertiary);
        }

        .preview-content {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            font-size: 15px;
            line-height: 1.6;
        }

        .preview-content h1 {
            font-size: 32px;
            margin: 24px 0 16px;
            font-weight: 700;
        }

        .preview-content h2 {
            font-size: 24px;
            margin: 20px 0 12px;
            font-weight: 600;
        }

        .preview-content h3 {
            font-size: 20px;
            margin: 16px 0 8px;
            font-weight: 600;
        }

        .preview-content p {
            margin: 12px 0;
        }

        .preview-content ul, .preview-content ol {
            margin: 12px 0;
            padding-left: 24px;
        }

        .preview-content li {
            margin: 4px 0;
        }

        .preview-content code {
            background: var(--bg-secondary);
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }

        .preview-content pre {
            background: var(--bg-secondary);
            padding: 16px;
            border-radius: 4px;
            overflow-x: auto;
            margin: 12px 0;
        }

        .preview-content pre code {
            background: transparent;
            padding: 0;
        }

        .preview-content blockquote {
            border-left: 3px solid var(--border);
            padding-left: 16px;
            margin: 12px 0;
            color: var(--text-secondary);
        }

        .preview-content strong {
            font-weight: 600;
        }

        .preview-content em {
            font-style: italic;
        }

        .preview-content hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 24px 0;
        }

        .tags-input-container {
            padding: 12px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
        }

        .tag-item {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
            background: var(--tag-bg);
            border-radius: 3px;
            font-size: 12px;
        }

        .tag-remove {
            cursor: pointer;
            color: var(--text-secondary);
            font-weight: bold;
        }

        .tag-remove:hover {
            color: var(--text-primary);
        }

        .tag-input {
            flex: 1;
            min-width: 100px;
            border: none;
            outline: none;
            font-size: 12px;
            padding: 4px 8px;
            background: transparent;
        }

        .tag-input::placeholder {
            color: var(--text-tertiary);
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-tertiary);
            gap: 12px;
        }

        .empty-state-icon {
            font-size: 48px;
        }

        .empty-state-text {
            font-size: 16px;
        }

        .mobile-toggle {
            display: none;
        }

        @media (max-width: 768px) {
            .sidebar {
                position: absolute;
                left: 0;
                top: 0;
                height: 100%;
                z-index: 100;
                transform: translateX(-100%);
                box-shadow: 2px 0 8px rgba(0, 0, 0, 0.1);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .mobile-toggle {
                display: block;
            }

            .editor-content {
                flex-direction: column;
            }

            .editor-pane {
                border-right: none;
                border-bottom: 1px solid var(--border);
            }

            .editor-pane:last-child {
                border-bottom: none;
            }

            .editor-actions {
                flex-wrap: wrap;
            }
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: 99;
        }

        .overlay.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="overlay" id="overlay"></div>
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-title">
                    <span>Notes</span>
                    <button class="btn-icon" id="newNoteBtn" title="New note">+</button>
                </div>
                <input type="text" class="search-box" id="searchBox" placeholder="Search notes...">
                <div class="tag-filter" id="tagFilter"></div>
            </div>
            <div class="notes-list" id="notesList"></div>
        </aside>

        <main class="main-content">
            <div class="editor-header">
                <button class="btn-icon mobile-toggle" id="menuToggle">☰</button>
                <div class="editor-actions">
                    <button class="btn" id="deleteBtn">Delete</button>
                    <button class="btn btn-primary" id="newNoteBtn2">New Note</button>
                </div>
            </div>

            <div class="editor-content" id="editorContent">
                <div class="empty-state">
                    <div class="empty-state-icon">📝</div>
                    <div class="empty-state-text">Select a note or create a new one</div>
                </div>
            </div>
        </main>
    </div>

    <script>
        class NotesApp {
            constructor() {
                this.notes = this.loadNotes();
                this.currentNote = null;
                this.searchQuery = '';
                this.activeTagFilter = null;
                this.init();
            }

            init() {
                this.setupEventListeners();
                this.renderNotesList();
                this.renderTagFilter();
            }

            setupEventListeners() {
                document.getElementById('newNoteBtn').addEventListener('click', () => this.createNewNote());
                document.getElementById('newNoteBtn2').addEventListener('click', () => this.createNewNote());
                document.getElementById('deleteBtn').addEventListener('click', () => this.deleteCurrentNote());
                document.getElementById('searchBox').addEventListener('input', (e) => this.handleSearch(e.target.value));
                document.getElementById('menuToggle').addEventListener('click', () => this.toggleSidebar());
                document.getElementById('overlay').addEventListener('click', () => this.closeSidebar());
            }

            loadNotes() {
                const stored = localStorage.getItem('notes');
                return stored ? JSON.parse(stored) : [];
            }

            saveNotes() {
                localStorage.setItem('notes', JSON.stringify(this.notes));
            }

            createNewNote() {
                const note = {
                    id: Date.now().toString(),
                    title: 'Untitled',
                    content: '',
                    tags: [],
                    createdAt: new Date().toISOString(),
                    updatedAt: new Date().toISOString()
                };

                this.notes.unshift(note);
                this.saveNotes();
                this.selectNote(note.id);
                this.renderNotesList();
                this.renderTagFilter();
                this.closeSidebar();
            }

            deleteCurrentNote() {
                if (!this.currentNote) return;

                if (confirm('Are you sure you want to delete this note?')) {
                    this.notes = this.notes.filter(n => n.id !== this.currentNote.id);
                    this.saveNotes();
                    this.currentNote = null;
                    this.renderNotesList();
                    this.renderTagFilter();
                    this.showEmptyState();
                }
            }

            selectNote(id) {
                this.currentNote = this.notes.find(n => n.id === id);
                if (this.currentNote) {
                    this.renderEditor();
                    this.renderNotesList();
                }
            }

            updateNote(updates) {
                if (!this.currentNote) return;

                Object.assign(this.currentNote, updates, {
                    updatedAt: new Date().toISOString()
                });

                this.saveNotes();
                this.renderNotesList();
                this.renderTagFilter();
            }

            handleSearch(query) {
                this.searchQuery = query.toLowerCase();
                this.renderNotesList();
            }

            filterNotes() {
                let filtered = this.notes;

                if (this.searchQuery) {
                    filtered = filtered.filter(note =>
                        note.title.toLowerCase().includes(this.searchQuery) ||
                        note.content.toLowerCase().includes(this.searchQuery) ||
                        note.tags.some(tag => tag.toLowerCase().includes(this.searchQuery))
                    );
                }

                if (this.activeTagFilter) {
                    filtered = filtered.filter(note =>
                        note.tags.includes(this.activeTagFilter)
                    );
                }

                return filtered;
            }

            getAllTags() {
                const tagSet = new Set();
                this.notes.forEach(note => {
                    note.tags.forEach(tag => tagSet.add(tag));
                });
                return Array.from(tagSet).sort();
            }

            renderTagFilter() {
                const container = document.getElementById('tagFilter');
                const allTags = this.getAllTags();

                if (allTags.length === 0) {
                    container.innerHTML = '';
                    return;
                }

                container.innerHTML = allTags.map(tag => `
                    <div class="tag-filter-item ${this.activeTagFilter === tag ? 'active' : ''}"
                         data-tag="${this.escapeHtml(tag)}">
                        ${this.escapeHtml(tag)}
                    </div>
                `).join('');

                container.querySelectorAll('.tag-filter-item').forEach(el => {
                    el.addEventListener('click', () => {
                        const tag = el.dataset.tag;
                        this.activeTagFilter = this.activeTagFilter === tag ? null : tag;
                        this.renderTagFilter();
                        this.renderNotesList();
                    });
                });
            }

            renderNotesList() {
                const container = document.getElementById('notesList');
                const filtered = this.filterNotes();

                if (filtered.length === 0) {
                    container.innerHTML = '<div style="padding: 24px; text-align: center; color: var(--text-tertiary); font-size: 14px;">No notes found</div>';
                    return;
                }

                container.innerHTML = filtered.map(note => {
                    const preview = note.content.substring(0, 100).replace(/[#*`\n]/g, ' ').trim();
                    return `
                        <div class="note-item ${this.currentNote?.id === note.id ? 'active' : ''}"
                             data-id="${note.id}">
                            <div class="note-item-title">${this.escapeHtml(note.title)}</div>
                            <div class="note-item-preview">${this.escapeHtml(preview || 'No content')}</div>
                            ${note.tags.length > 0 ? `
                                <div class="note-item-tags">
                                    ${note.tags.map(tag => `<span class="note-tag">${this.escapeHtml(tag)}</span>`).join('')}
                                </div>
                            ` : ''}
                        </div>
                    `;
                }).join('');

                container.querySelectorAll('.note-item').forEach(el => {
                    el.addEventListener('click', () => {
                        this.selectNote(el.dataset.id);
                        this.closeSidebar();
                    });
                });
            }

            renderEditor() {
                const container = document.getElementById('editorContent');

                container.innerHTML = `
                    <div class="editor-pane">
                        <div class="pane-header">Edit</div>
                        <input type="text" class="title-input" id="titleInput"
                               placeholder="Untitled" value="${this.escapeHtml(this.currentNote.title)}">
                        <div class="tags-input-container" id="tagsContainer">
                            ${this.currentNote.tags.map(tag => `
                                <div class="tag-item">
                                    <span>${this.escapeHtml(tag)}</span>
                                    <span class="tag-remove" data-tag="${this.escapeHtml(tag)}">×</span>
                                </div>
                            `).join('')}
                            <input type="text" class="tag-input" id="tagInput" placeholder="Add tag...">
                        </div>
                        <textarea class="editor-textarea" id="contentTextarea"
                                  placeholder="Start writing...">${this.escapeHtml(this.currentNote.content)}</textarea>
                    </div>
                    <div class="editor-pane">
                        <div class="pane-header">Preview</div>
                        <div class="preview-content" id="previewContent"></div>
                    </div>
                `;

                const titleInput = document.getElementById('titleInput');
                const contentTextarea = document.getElementById('contentTextarea');
                const tagInput = document.getElementById('tagInput');

                titleInput.addEventListener('input', (e) => {
                    this.updateNote({ title: e.target.value || 'Untitled' });
                });

                contentTextarea.addEventListener('input', (e) => {
                    this.updateNote({ content: e.target.value });
                    this.updatePreview(e.target.value);
                });

                tagInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter' && e.target.value.trim()) {
                        e.preventDefault();
                        const tag = e.target.value.trim();
                        if (!this.currentNote.tags.includes(tag)) {
                            this.currentNote.tags.push(tag);
                            this.updateNote({ tags: this.currentNote.tags });
                            this.renderEditor();
                        }
                        e.target.value = '';
                    }
                });

                document.querySelectorAll('.tag-remove').forEach(el => {
                    el.addEventListener('click', () => {
                        const tag = el.dataset.tag;
                        this.currentNote.tags = this.currentNote.tags.filter(t => t !== tag);
                        this.updateNote({ tags: this.currentNote.tags });
                        this.renderEditor();
                    });
                });

                this.updatePreview(this.currentNote.content);
            }

            updatePreview(markdown) {
                const preview = document.getElementById('previewContent');
                if (preview) {
                    preview.innerHTML = this.parseMarkdown(markdown);
                }
            }

            parseMarkdown(md) {
                if (!md) return '<p style="color: var(--text-tertiary);">Nothing to preview</p>';

                let html = md;

                html = html.replace(/```([^`]+)```/g, '<pre><code>$1</code></pre>');
                html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

                html = html.replace(/^### (.*$)/gm, '<h3>$1</h3>');
                html = html.replace(/^## (.*$)/gm, '<h2>$1</h2>');
                html = html.replace(/^# (.*$)/gm, '<h1>$1</h1>');

                html = html.replace(/\*\*\*([^*]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
                html = html.replace(/__([^_]+)__/g, '<strong>$1</strong>');
                html = html.replace(/_([^_]+)_/g, '<em>$1</em>');

                html = html.replace(/^> (.*$)/gm, '<blockquote>$1</blockquote>');

                html = html.replace(/^---$/gm, '<hr>');
                html = html.replace(/^\*\*\*$/gm, '<hr>');

                html = html.replace(/^\* (.*$)/gm, '<li>$1</li>');
                html = html.replace(/^- (.*$)/gm, '<li>$1</li>');
                html = html.replace(/^(\d+)\. (.*$)/gm, '<li>$2</li>');

                html = html.replace(/(<li>.*<\/li>)/s, function(match) {
                    const items = match.match(/<li>.*?<\/li>/g);
                    if (items && items[0].match(/^\d+\./)) {
                        return '<ol>' + items.join('') + '</ol>';
                    }
                    return '<ul>' + items.join('') + '</ul>';
                });

                html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');

                html = html.split('\n\n').map(para => {
                    if (para.match(/^<[h|u|o|p|b]/)) {
                        return para;
                    }
                    if (para.trim()) {
                        return '<p>' + para + '</p>';
                    }
                    return para;
                }).join('\n');

                return html;
            }

            showEmptyState() {
                const container = document.getElementById('editorContent');
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📝</div>
                        <div class="empty-state-text">Select a note or create a new one</div>
                    </div>
                `;
            }

            toggleSidebar() {
                const sidebar = document.getElementById('sidebar');
                const overlay = document.getElementById('overlay');
                sidebar.classList.toggle('open');
                overlay.classList.toggle('show');
            }

            closeSidebar() {
                const sidebar = document.getElementById('sidebar');
                const overlay = document.getElementById('overlay');
                sidebar.classList.remove('open');
                overlay.classList.remove('show');
            }

            escapeHtml(text) {
                const map = {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                };
                return text.replace(/[&<>"']/g, m => map[m]);
            }
        }

        const app = new NotesApp();
    </script>
</body>
</html>
