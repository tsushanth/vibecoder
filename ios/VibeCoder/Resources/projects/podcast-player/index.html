<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Podcast Player</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">
        <!-- Player Section -->
        <div class="player-section">
            <div class="now-playing" id="nowPlaying">
                <div class="podcast-title" id="podcastTitle">Select an episode</div>
                <div class="episode-title" id="episodeTitle"></div>
            </div>

            <div class="player-controls">
                <div class="progress-container">
                    <div class="time-display">
                        <span id="currentTime">0:00</span>
                        <span id="duration">0:00</span>
                    </div>
                    <input type="range" id="progressBar" min="0" max="100" value="0" step="0.1">
                </div>

                <div class="control-buttons">
                    <button id="prevBtn" class="control-btn" title="Previous">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
                        </svg>
                    </button>
                    <button id="rewindBtn" class="control-btn" title="Rewind 15s">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M11.99 5V1l-5 5 5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6h-2c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
                            <text x="9" y="16" font-size="8" fill="currentColor">15</text>
                        </svg>
                    </button>
                    <button id="playPauseBtn" class="control-btn play-pause">
                        <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M8 5v14l11-7z"/>
                        </svg>
                        <svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor" style="display: none;">
                            <path d="M6 4h4v16H6zM14 4h4v16h-4z"/>
                        </svg>
                    </button>
                    <button id="forwardBtn" class="control-btn" title="Forward 30s">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/>
                            <text x="9" y="16" font-size="8" fill="currentColor">30</text>
                        </svg>
                    </button>
                    <button id="nextBtn" class="control-btn" title="Next">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M16 18h2V6h-2zm-11-1l8.5-6L5 5z"/>
                        </svg>
                    </button>
                </div>

                <div class="speed-control">
                    <button id="speedBtn" class="speed-btn">1.0x</button>
                </div>
            </div>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="episodes">Episodes</button>
            <button class="tab-btn" data-tab="chapters">Chapters</button>
            <button class="tab-btn" data-tab="queue">Queue</button>
        </div>

        <!-- Content Sections -->
        <div class="content">
            <!-- Episodes Tab -->
            <div class="tab-content active" id="episodesTab">
                <div class="episode-list" id="episodeList"></div>
            </div>

            <!-- Chapters Tab -->
            <div class="tab-content" id="chaptersTab">
                <div class="chapters-container">
                    <div id="chaptersList" class="chapters-list"></div>
                </div>
            </div>

            <!-- Queue Tab -->
            <div class="tab-content" id="queueTab">
                <div class="queue-container">
                    <div class="queue-header">
                        <h3>Up Next</h3>
                        <button id="clearQueueBtn" class="clear-btn">Clear All</button>
                    </div>
                    <div id="queueList" class="queue-list"></div>
                    <div id="emptyQueue" class="empty-state">Queue is empty</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Speed Selection Modal -->
    <div id="speedModal" class="modal">
        <div class="modal-content">
            <h3>Playback Speed</h3>
            <div class="speed-options">
                <button class="speed-option" data-speed="0.5">0.5x</button>
                <button class="speed-option" data-speed="0.75">0.75x</button>
                <button class="speed-option active" data-speed="1.0">1.0x</button>
                <button class="speed-option" data-speed="1.25">1.25x</button>
                <button class="speed-option" data-speed="1.5">1.5x</button>
                <button class="speed-option" data-speed="2.0">2.0x</button>
            </div>
            <button id="closeSpeedModal" class="modal-close">Close</button>
        </div>
    </div>

    <audio id="audioPlayer"></audio>

    <script src="app.js"></script>
</body>
</html>
