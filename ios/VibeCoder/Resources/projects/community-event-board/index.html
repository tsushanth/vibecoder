<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Events</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="title">🎉 COMMUNITY EVENTS</h1>
            <p class="subtitle">Discover what's happening near you</p>
        </header>

        <div class="controls">
            <div class="filter-section">
                <h3>Filter by Date</h3>
                <div class="date-filters">
                    <button class="filter-btn active" data-filter="all">All Events</button>
                    <button class="filter-btn" data-filter="upcoming">Upcoming</button>
                    <button class="filter-btn" data-filter="past">Past</button>
                </div>
            </div>

            <div class="filter-section">
                <h3>Filter by Category</h3>
                <div class="category-filters">
                    <button class="category-btn active" data-category="all">All</button>
                    <button class="category-btn" data-category="music">Music</button>
                    <button class="category-btn" data-category="sports">Sports</button>
                    <button class="category-btn" data-category="food">Food</button>
                    <button class="category-btn" data-category="arts">Arts</button>
                    <button class="category-btn" data-category="tech">Tech</button>
                    <button class="category-btn" data-category="community">Community</button>
                </div>
            </div>
        </div>

        <button class="add-event-btn" id="addEventBtn">+ Add New Event</button>

        <div id="eventGrid" class="event-grid"></div>

        <div id="addEventModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2>Create New Event</h2>
                <form id="eventForm">
                    <div class="form-group">
                        <label>Event Title</label>
                        <input type="text" id="eventTitle" required>
                    </div>
                    <div class="form-group">
                        <label>Date</label>
                        <input type="date" id="eventDate" required>
                    </div>
                    <div class="form-group">
                        <label>Time</label>
                        <input type="time" id="eventTime" required>
                    </div>
                    <div class="form-group">
                        <label>Category</label>
                        <select id="eventCategory" required>
                            <option value="music">Music</option>
                            <option value="sports">Sports</option>
                            <option value="food">Food</option>
                            <option value="arts">Arts</option>
                            <option value="tech">Tech</option>
                            <option value="community">Community</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Location Name</label>
                        <input type="text" id="eventLocation" required>
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea id="eventDescription" rows="3" required></textarea>
                    </div>
                    <button type="submit" class="submit-btn">Create Event</button>
                </form>
            </div>
        </div>

        <div id="eventDetailModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <div id="eventDetailContent"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
