org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AGP 9's built-in Kotlin support conflicts with the explicit
# org.jetbrains.kotlin.android plugin still applied by the shared library
# modules (PaywallKit/RatingKit/CrossPromoKit-Android) — those repos are
# also used by other apps still on AGP 8.x, so their plugin blocks can't
# change without breaking those apps. Same bridge as ReadAloudAI/RiddleVerse.
# NOTE: removed in AGP 10.0 (mid-2026) — revisit then.
android.builtInKotlin=false
android.newDsl=false

android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
