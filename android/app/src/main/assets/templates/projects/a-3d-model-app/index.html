<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Model Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>📸 3D Model Generator</h1>
            <p>Create 3D models from your photos</p>
        </header>

        <main>
            <section class="upload-section" id="uploadSection">
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">📷</div>
                    <h2>Upload or Take a Photo</h2>
                    <p>Your photo will be converted into a 3D model</p>
                    <input type="file" id="imageInput" accept="image/*" capture="environment">
                    <label for="imageInput" class="upload-btn">Choose Image</label>
                </div>

                <div class="model-options" id="modelOptions" style="display: none;">
                    <h3>3D Model Options</h3>
                    <div class="option-group">
                        <label>Model Type:</label>
                        <select id="modelType">
                            <option value="heightmap">Height Map (Terrain)</option>
                            <option value="extrude">Extruded Shape</option>
                            <option value="sphere">Photo Sphere</option>
                            <option value="cube">Photo Cube</option>
                        </select>
                    </div>
                    <div class="option-group">
                        <label>Detail Level: <span id="detailValue">32</span></label>
                        <input type="range" id="detailLevel" min="16" max="128" value="32" step="16">
                    </div>
                    <div class="option-group">
                        <label>Depth Intensity: <span id="depthValue">1.0</span></label>
                        <input type="range" id="depthIntensity" min="0.1" max="3.0" value="1.0" step="0.1">
                    </div>
                    <button class="generate-btn" id="generateBtn">Generate 3D Model</button>
                </div>
            </section>

            <section class="viewer-section" id="viewerSection" style="display: none;">
                <div class="viewer-header">
                    <h2>3D Model Viewer</h2>
                    <div class="viewer-controls">
                        <button class="control-btn" id="resetViewBtn">Reset View</button>
                        <button class="control-btn" id="exportBtn">Export STL</button>
                        <button class="control-btn" id="newModelBtn">New Model</button>
                    </div>
                </div>
                <canvas id="canvas3d"></canvas>
                <div class="viewer-info">
                    <p>🖱️ Drag to rotate • 📌 Pinch/Scroll to zoom</p>
                    <p id="modelInfo"></p>
                </div>
            </section>

            <section class="gallery-section" id="gallerySection">
                <h3>📚 Saved Models</h3>
                <div class="gallery-grid" id="galleryGrid"></div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
