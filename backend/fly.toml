app = "vibecoder-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  # the dedicated Stripe customer-portal configuration for VibeBuild Pro (not a secret)
  STRIPE_PORTAL_CONFIGURATION_ID = "bpc_1UOBBOKFBTQTkmztwLXvhEnp"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[deploy]
  strategy = "rolling"
