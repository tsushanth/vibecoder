steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/${PROJECT_ID}/vibecoder/vibecoder-api:${SHORT_SHA}'
      - '-t'
      - 'us-central1-docker.pkg.dev/${PROJECT_ID}/vibecoder/vibecoder-api:latest'
      - '.'
    dir: backend

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'us-central1-docker.pkg.dev/${PROJECT_ID}/vibecoder/vibecoder-api'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'vibecoder-api'
      - '--image'
      - 'us-central1-docker.pkg.dev/${PROJECT_ID}/vibecoder/vibecoder-api:${SHORT_SHA}'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'

images:
  - 'us-central1-docker.pkg.dev/${PROJECT_ID}/vibecoder/vibecoder-api'

options:
  logging: CLOUD_LOGGING_ONLY
