# vibe-proxy. NOT DEPLOYED. The app name must be created and confirmed before the first deploy.
# Secrets (set with `fly secrets set`, never in this file): DATABASE_URL, VIBE_MASTER_KEY, OPENROUTER_API_KEY.
# Plain settings: BASE_DOMAIN below; optional PER_IP_PER_MIN, PER_APP_PER_MIN, DAILY_CALLS, APP_AI_DAILY_MICROS, PLATFORM_AI_DAILY_MICROS.
# The database schema is migrated explicitly with `node store/migrate.js` (not at release time).
app = "vibe-proxy"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  BASE_DOMAIN = "vibebuild.cc"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
